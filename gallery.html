<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>本页图片 · Media Hover Toolbar</title>
<link rel="stylesheet" href="src/common/theme.css">
<link rel="stylesheet" href="src/options/options.css">
<link rel="stylesheet" href="src/gallery/gallery.css">
</head>
<body class="gallery-page">
<header class="g-header">
  <div class="brand">
    <span class="logo" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="3.2"/><circle cx="8.4" cy="9.4" r="1.5" fill="currentColor" stroke="none"/><path d="M4.6 17.2l4.1-4.1a1.9 1.9 0 0 1 2.7 0l2.9 2.9"/><path d="M13.4 19.2H20"/></svg></span>
    本页图片 <small id="pageTitle">正在读取当前页面…</small>
  </div>
  <div class="hdr-actions">
    <span class="g-site" id="siteInfo"></span>
    <label class="g-view g-siteoff" id="siteOffWrap" hidden title="勾选后扩展在这个站点整体停用"><input type="checkbox" id="siteOff">禁用本站</label>
    <label class="g-view" title="只列屏幕上下各一屏内的图；关掉则列出这个页面已经加载的全部图"><input type="checkbox" id="onlyView">只看屏幕附近</label>
    <label class="g-view" id="feedAllWrap" title="连滚过去、被虚拟列表从页面上摘掉的微博一起收：图地址直接问微博自己那份信息流数据要，不用先把帖子滚出来"><input type="checkbox" id="feedAll">全部微博</label>
    <label class="g-view" id="apiModeWrap" hidden title="勾上就不用再点「帮我翻页」：列表滚到底自动向微博的读流接口要下一页，一路往下能翻到这个账号最早那条。微博页面自己最多让你翻到最近几百条就到底，这条绕过了那个截断。只读、不滚动你的页面"><input type="checkbox" id="apiMode">API 模式</label>
    <label class="g-view" id="xhsFullWrap" hidden title="小红书个人主页的列表每条笔记只给一张封面。勾上后逐条去取笔记内页，把每条笔记的全部图片都解析出来，显示成一条笔记一组九宫格（小红书的内容接口要前端签名，只能这么读）。只读、不滚动你的页面"><input type="checkbox" id="xhsFull">展开每条笔记的全部图</label>
    <button id="btnWide" title="下拉面板最宽只能 800px，点这里用接近全屏的大窗打开">⤢ 大窗</button>
    <button id="btnRefresh" title="重新扫描当前页面">刷新</button>
    <button id="btnMore" hidden title="替你把微博的信息流往后翻页加载：先叫微博自己加载下一页（页面画面不动），它不肯就照页面那条读流请求直接向后端要后面几页。全程只读、不滚动你的页面">帮我翻页</button>
    <button id="btnSettings" class="primary" title="打开 Media Hover Toolbar 设置">设置</button>
  </div>
</header>

<nav class="g-tabs" id="gTabs">
  <button type="button" data-panel="images" class="active">图片</button>
  <button type="button" data-panel="filter">筛选微博</button>
</nav>

<main class="g-main" id="panelImages">
  <div class="g-summary" id="summary">正在扫描当前网页…</div>
  <div class="g-groups" id="groups"></div>
  <div class="g-loading" id="loading"><span class="g-spin"></span><span id="loadingText">正在扫描图片…</span></div>
  <div class="g-empty" id="empty" hidden>
    <div class="g-empty-ic">🖼</div>
    <h2 id="emptyTitle">这个页面没有找到可用的图片</h2>
    <p id="emptyText">图片可能还没加载完；滚一下页面再点“刷新”。</p>
  </div>
</main>

<section class="g-main g-filter" id="panelFilter" hidden>
  <div class="wf-row wf-master">
    <span class="wf-label">开关</span>
    <label class="wf-chk"><input type="checkbox" id="wfEnabled"> 启用筛选</label>
    <span class="wf-hint" id="wfEnabledHint"></span>
  </div>
  <div class="wf-row">
    <span class="wf-label">类型</span>
    <div class="wf-chips">
      <label><input type="checkbox" data-wf-type="original"> 原创</label>
      <label><input type="checkbox" data-wf-type="repost"> 转发</label>
      <i class="wf-sep"></i>
      <label><input type="checkbox" data-wf-type="text"> 纯文字</label>
      <label><input type="checkbox" data-wf-type="image"> 含图片</label>
      <label><input type="checkbox" data-wf-type="video"> 含视频</label>
      <label><input type="checkbox" data-wf-type="music"> 含音乐</label>
    </div>
  </div>
  <div class="wf-row">
    <span class="wf-label">关键字</span>
    <span class="wf-search">
      <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4.5 4.5"/></svg>
      <input id="wfKeywords" type="text" placeholder="搜索微博内容（一行一个也行）" autocomplete="off">
    </span>
    <select id="wfKeywordMode" title="关键字怎么用"><option value="has">包含</option><option value="none">不含</option><option value="expr">逻辑式</option></select>
  </div>
  <div class="wf-row" id="wfExprRow" hidden>
    <span class="wf-label">语法</span>
    <span class="wf-hint" id="wfExprHint"></span>
  </div>
  <div class="wf-row">
    <span class="wf-label">时间</span>
    <input type="date" id="wfFrom">
    <span class="wf-to">到</span>
    <input type="date" id="wfTo">
    <span class="wf-hint">留空不限；时间读不出来的微博会保留</span>
  </div>
  <div class="wf-row">
    <span class="wf-label">范围</span>
    <label class="wf-chk"><input type="checkbox" id="wfAllSites"> 应用到所有微博网站</label>
    <span class="wf-hint" id="wfSiteHint"></span>
  </div>
  <div class="wf-row wf-exp">
    <span class="wf-label">实验</span>
    <label class="wf-chk"><input type="checkbox" id="wfExperimental"> 让被筛掉的微博真正消失（前后紧连、不留空位）</label>
  </div>
  <p class="wf-warn">实验功能：需要直接改微博页面里的内部列表数据。微博改版后可能失效；极端情况下当前页面可能显示异常，按 F5 刷新即可恢复。默认关闭，失败会自动退回「只隐藏页面元素」。</p>
  <div class="wf-foot">
    <span id="wfStatus" class="wf-status">筛选会立刻生效，不用刷新</span>
    <span class="sp"></span>
    <button id="wfClear" type="button">清除筛选</button>
  </div>
  <p class="wf-note">勾上的类型才会显示（原创/转发二选一；纯文字=没有任何媒体）。被筛掉的微博整条消失、前后紧连，不留占位。</p>
</section>

<footer class="g-foot">
  <div class="g-progress" id="progress" hidden><i id="progressBar"></i></div>
  <div class="g-foot-row">
    <label class="g-check g-all"><input type="checkbox" id="selAll"> 全选</label>
    <button id="btnInvert">反选</button>
    <button id="btnClear">清空</button>
    <span class="g-sel" id="selCount">已选 0 张</span>
    <span class="sp"></span>
    <label class="g-tier" id="morePagesWrap" title="点「帮我翻页」一次翻几页（1~10）。翻页就是替你多问微博几次，问得越急越容易被限流，别一次拉满">翻页页数
      <select id="morePages">
        <option value="1">1 页</option>
        <option value="3">3 页</option>
        <option value="5">5 页</option>
        <option value="10">10 页</option>
      </select>
    </label>
    <label class="g-tier" title="发给 ComfyUI 的清晰度档位：卡片 mw690 约 41KB、高清 mw2000 约 283KB、原图 large 可能 4MB 以上">发送档位
      <select id="sendTier">
        <option value="card">卡片 mw690</option>
        <option value="full">高清 mw2000</option>
        <option value="orig">原图 large</option>
      </select>
    </label>
    <span class="g-hint g-comfy" id="comfyInfo"></span>
    <span class="g-hint" id="status"></span>
    <button id="btnCancel" class="danger" hidden>停止</button>
    <button id="btnSend">发送到 ComfyUI</button>
    <button id="btnSendRun" class="primary">发送并排队执行</button>
  </div>
</footer>

<div class="g-lightbox" id="lightbox" hidden>
  <button class="g-lb-btn g-lb-close" id="lbClose" title="关闭（Esc）">✕</button>
  <button class="g-lb-btn g-lb-prev" id="lbPrev" title="上一张（←）">‹</button>
  <img id="lbImg" alt="">
  <button class="g-lb-btn g-lb-next" id="lbNext" title="下一张（→）">›</button>
  <div class="g-lb-meta" id="lbMeta"></div>
</div>

<div class="g-boot" id="bootMask"><span class="g-spin"></span><span>正在按窗口大小排好三列网格…</span></div>

<div id="toast" class="toast"></div>
<script type="module" src="src/gallery/gallery.mjs"></script>
</body>
</html>
