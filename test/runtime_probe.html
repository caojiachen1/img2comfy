<!doctype html>
<html lang="zh"><head><meta charset="utf-8"><title>runtime probe</title></head><body>
<pre id="out">running…</pre>
<script type="module">
// 端到端验「自动安装运行时」：假装扩展包里没有任何 wasm（vendorBase 指到不存在的路径），
// 走真实 CDN 下载 → Cache API → blob 交给 ORT → 跑一次真推理。
// 这一步同时验 CDN 地址与版本是否和包里的 .mjs glue 对得上（版本不符 ORT 会直接报错）。
import * as rt from '/src/common/runtime-install.js';

const log = [];
const say = (o) => { log.push(o); document.getElementById('out').textContent = JSON.stringify(log, null, 1); };
window.__probe = () => log;
const FAKE_VENDOR = location.origin + '/no-such-vendor';
const REAL_GLUE = location.origin + '/vendor';

try {
    const t0 = performance.now();
    const s0 = await rt.runtimeStatus({ vendorBase: FAKE_VENDOR });
    say({ step: 'status before', ready: s0.ready, files: s0.files.map((f) => ({ n: f.name.slice(9, 24), src: f.source, have: f.have })), requiredBytes: s0.requiredBytes });
    if (s0.ready) say({ note: '本机居然已有缓存，先清掉再测' , cleared: await rt.clearRuntimeCache() });

    let lastPct = -1, events = 0;
    const r = await rt.installRuntime({
        vendorBase: FAKE_VENDOR, onlyRequired: true,
        onProgress: (p) => {
            events++;
            const pct = p.size ? Math.round(p.loaded / p.size * 100) : 0;
            if (pct >= lastPct + 20 || p.phase === 'done') { lastPct = pct; say({ prog: { file: p.file, phase: p.phase, pct, mb: +(p.loaded / 1048576).toFixed(1), speedMBs: p.speed ? +(p.speed / 1048576).toFixed(2) : null } }); }
        },
    });
    say({ step: 'install', ok: r.ok, installed: r.installed, errors: (r.errors || []).slice(0, 3), ms: Math.round(performance.now() - t0), progressEvents: events });
    say({ step: 'status after', ready: r.status.ready, files: r.status.files.map((f) => ({ n: f.name.slice(9, 24), src: f.source, have: f.have, ready: f.ready })) });

    const ort = await import('/vendor/ort.webgpu.bundle.min.mjs');
    // glue 必须来自扩展包（blob 模块被 CSP 挡），这里用真实 vendor 路径模拟
    const applied = await rt.applyWasmPaths({ env: { wasm: ort.env.wasm } }, FAKE_VENDOR);
    ort.env.wasm.wasmPaths = { wasm: ort.env.wasm.wasmPaths.wasm, mjs: `${REAL_GLUE}/ort-wasm-simd-threaded.asyncify.mjs` };
    say({ step: 'applyWasmPaths', applied, wasm: String(ort.env.wasm.wasmPaths.wasm).slice(0, 26) + '…' });

    const sess = await ort.InferenceSession.create('/test/media/yunet.onnx', { sess_options: { logSeverityLevel: 3 }, executionProviders: ['wasm'] });
    const input = new ort.Tensor('float32', new Float32Array(1 * 3 * 640 * 640), [1, 3, 640, 640]);
    const out = await sess.run({ [sess.inputNames[0]]: input });
    say({ step: 'inference with installed wasm', cls8: Array.from(out.cls_8.dims || []), ms: Math.round(performance.now() - t0) });
    say({ VERDICT: r.ok && r.status.ready ? '自动安装链路可用' : '自动安装失败' });
} catch (e) {
    say({ fatal: String(e && e.stack || e.message || e).split('\n').slice(0, 6).join(' | ') });
}
window.__done = true;
document.getElementById('out').textContent = JSON.stringify(log, null, 1);
</script>
</body></html>
